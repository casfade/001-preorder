<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Order Menu V8</title>
<style>
:root{--bg:#f5f5f3;--white:#fff;--text:#171717;--muted:#777;--line:#e5e5e2;--soft:#ededeb;--black:#111}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button{font:inherit;border:0;cursor:pointer}
.hidden{display:none!important}

/* Landing */
.order-type-screen{position:fixed;inset:0;width:100vw;height:100dvh;padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:20px;background:var(--bg);z-index:100}
.start-card{width:100%;height:100%;border:1px solid var(--line);border-radius:26px;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font-size:clamp(34px,6vw,72px);font-weight:850;letter-spacing:-.055em;box-shadow:0 8px 30px #00000009;transition:.12s}
.start-card:active{transform:scale(.985);background:#111;color:#fff}

/* Menu */
.app{min-height:100vh}
.layout{display:block;min-height:100vh}
.menu-area{padding:24px 28px 105px;min-width:0}
.hero{margin-bottom:16px}
.hero h1{margin:0;font-size:32px;letter-spacing:-.055em}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 0 14px;scrollbar-width:none;position:sticky;top:0;background:var(--bg);z-index:15}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:11px 17px;border-radius:999px;background:#fff;border:1px solid var(--line);color:#555;font-weight:750}
.tab.active{background:#111;color:#fff;border-color:#111}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:12px 0 13px}
.section-title h2{margin:0;font-size:18px}
.section-title span{font-size:13px;color:var(--muted)}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.product{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;min-width:0}
.product:active{transform:scale(.985)}
.photo{aspect-ratio:1/1;background:#ddd;overflow:hidden;position:relative}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;left:9px;top:9px;background:#fff;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:850}
.product-info{padding:12px;min-height:126px;display:flex;flex-direction:column}
.product-info h3{margin:0 0 5px;font-size:15px;line-height:1.15}
.desc{font-size:11px;line-height:1.35;color:var(--muted)}
.price-row{margin-top:auto;padding-top:9px;display:flex;align-items:center;justify-content:space-between}
.price{font-weight:850;font-size:13px}
.add{background:#111;color:#fff;border-radius:9px;padding:8px 11px;font-size:11px;font-weight:800;pointer-events:none}

/* Cart */
.cart-panel{background:#fff;border-left:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.cart-head{padding:22px;border-bottom:1px solid var(--line)}
.cart-head h2{margin:0;font-size:22px}
.cart-head p{margin:5px 0 0;color:var(--muted);font-size:13px}
.cart-items{padding:14px 20px;overflow:auto;flex:1}
.empty{text-align:center;color:#888;padding:60px 15px}
.cart-item{padding:13px 0;border-bottom:1px solid var(--line)}
.cart-item-top{display:flex;justify-content:space-between;gap:10px}
.cart-item h4{margin:0;font-size:14px}.cart-item small{display:block;margin-top:3px;color:var(--muted)}
.qty{display:flex;align-items:center;gap:9px;margin-top:9px}
.qty button{width:28px;height:28px;border-radius:8px;background:var(--soft);font-weight:900}
.qty span{min-width:16px;text-align:center;font-weight:800}
.cart-bottom{padding:16px 20px 20px;border-top:1px solid var(--line)}
.summary-row{display:flex;justify-content:space-between;margin:7px 0;color:#555}
.summary-row.total{font-size:21px;font-weight:900;color:#111;margin-top:14px}
.checkout{width:100%;padding:15px;margin-top:13px;border-radius:12px;background:#111;color:#fff;font-weight:850}
.checkout:disabled{opacity:.35}

/* Review */
.modal-wrap{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px;z-index:200}
.modal-wrap.show{display:flex}
.modal{width:min(700px,100%);background:#fff;border-radius:24px;padding:32px;box-shadow:0 30px 80px #0005}
.modal h2{margin:0 0 5px;font-size:34px;letter-spacing:-.045em}
.modal p{margin:0;color:var(--muted);font-size:14px}
.receipt{border:1px dashed #bbb;padding:22px;margin:20px 0;max-height:52vh;overflow:auto;font:14px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}
.modal-actions{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.secondary,.primary{padding:17px;border-radius:12px;font-weight:850}
.secondary{background:var(--soft)}.primary{background:#111;color:#fff}
.printer-status{display:none;margin-bottom:14px;padding:11px 13px;border-radius:10px;font-size:12px}
.printer-status.show{display:block}.printer-status.error{background:#fff0f0;color:#c33}.printer-status.success{background:#eefaf3;color:#16834b}

/* Portrait-first mobile */

/* Cart drawer + snackbar */
.cart-panel{
  position:fixed;
  top:0;
  right:0;
  width:min(430px,100vw);
  height:100dvh;
  z-index:100;
  transform:translateX(105%);
  transition:transform .22s ease;
  box-shadow:-18px 0 50px #00000018;
}
.cart-panel.open{transform:translateX(0)}
.drawer-close{
  background:var(--soft);
  border-radius:9px;
  padding:8px 11px;
  font-size:12px;
  font-weight:800;
}
.view-orders-bar{
  position:fixed;
  left:50%;
  bottom:16px;
  transform:translateX(-50%);
  width:min(430px,calc(100vw - 24px));
  z-index:40;
  background:#111;
  color:#fff;
  border-radius:14px;
  padding:14px 17px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 10px 30px #00000025;
}
.view-orders-bar strong{font-size:13px}
.view-orders-bar span{font-size:13px}
.view-orders-bar b{font-size:15px}
.view-orders-bar.added{animation:orderAdded .28s ease}
@keyframes orderAdded{0%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.025)}100%{transform:translateX(-50%) scale(1)}}

@media(max-width:700px){
  .order-type-screen{grid-template-columns:1fr;grid-template-rows:1fr 1fr;padding:14px;gap:14px}
  .start-card{border-radius:22px;font-size:42px}
  .layout{display:block}
  .menu-area{padding:16px 12px 92px}
  .hero h1{font-size:28px}
  .tabs{margin-right:-12px;padding-right:12px}
  .tab{padding:10px 14px;font-size:13px}
  .products{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .photo{aspect-ratio:1/1}
  .product-info{padding:9px;min-height:116px}
  .product-info h3{font-size:14px}
  .desc{font-size:10.5px}
  .add{padding:7px 9px;font-size:10px}
  .cart-panel{top:0;right:0;left:0;width:100vw;height:100dvh;border:0;z-index:100}
  .cart-items{display:block}
  .cart-head{padding:18px 16px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}
  .cart-bottom{padding:16px;border-top:1px solid var(--line)}
  .summary-row:not(.total){display:flex}.summary-row.total{margin-top:14px}.checkout{margin-top:12px}
  .modal{padding:22px;border-radius:20px}.modal h2{font-size:29px}.receipt{font-size:12px}
}

/* V8 drawer refinements */
.cart-head{
  padding:22px 20px 18px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.cart-head h2{
  margin:0;
  font-size:32px;
  font-weight:800;
  letter-spacing:-.8px;
}
.close-cart{
  width:52px;
  height:52px;
  border:0;
  background:transparent;
  font-size:42px;
  line-height:1;
  color:var(--text);
  cursor:pointer;
  display:grid;
  place-items:center;
  padding:0;
}
.cart-panel.open ~ .view-orders-bar{display:none!important}

</style>
</head>
<body>

<section id="orderTypeScreen" class="order-type-screen">
  <button class="start-card" onclick="startOrder('Dine In')">Dine In</button>
  <button class="start-card" onclick="startOrder('Take Out')">Take Out</button>
</section>

<div class="app hidden">
<main class="layout">
<section class="menu-area">
<div class="hero"><h1 id="menuTitle">Dine In</h1></div>
<nav class="tabs" id="tabs"></nav>
<div id="menu"></div>
</section>

<aside class="cart-panel" id="cartPanel">
<div class="cart-head">
  <h2>Your Order</h2>
  <button class="close-cart" aria-label="Close order" onclick="closeCart()">×</button>
</div>
<div class="cart-items" id="cartItems"></div>
<div class="cart-bottom">
  <div class="summary-row"><span>Subtotal</span><strong id="subtotal">₱0.00</strong></div>
  <div class="summary-row"><span>Tax</span><strong>₱0.00</strong></div>
  <div class="summary-row total"><span>Total</span><span id="total">₱0.00</span></div>
  <button class="checkout" id="checkout" disabled>Check Out Items</button>
</div>
</aside>
</main>

<!-- CART SNACKBAR -->
<button class="view-orders-bar" id="viewOrdersBar" onclick="openCart()">
  <span><b id="snackCount">0</b> <span id="snackItemsWord">items</span> in your order</span>
  <strong>View Orders</strong>
</button>

</div>

<div class="modal-wrap" id="modal">
<div class="modal">
<h2>Check Out Items</h2>
<p id="modalMeta"></p>
<div class="receipt" id="receiptPreview"></div>
<div class="printer-status" id="printerStatus"></div>
<div class="modal-actions">
<button class="secondary" id="cancel">Back to Order</button>
<button class="primary" id="print">Print Order</button>
</div>
</div>
</div>

<script>
const MENU=[
["classic-burger","Classic Burger","Mains",180,"Beef patty, lettuce, tomato and house sauce.","Best Seller","https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=700&q=80"],
["crispy-chicken","Crispy Chicken","Mains",195,"Crispy fried chicken with gravy.","Must Try","https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?auto=format&fit=crop&w=700&q=80"],
["double-cheese","Double Cheese Burger","Mains",240,"Two beef patties, double cheese and house sauce.","Best Seller","https://images.unsplash.com/photo-1553979459-d2229ba7433a?auto=format&fit=crop&w=700&q=80"],
["bacon-burger","Bacon Burger","Mains",230,"Beef patty, crispy bacon and melted cheese.","","https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=700&q=80"],
["chicken-sandwich","Chicken Sandwich","Mains",185,"Crispy chicken, lettuce and creamy sauce.","","https://images.unsplash.com/photo-1606755962773-d324e0a13086?auto=format&fit=crop&w=700&q=80"],
["spicy-chicken","Spicy Chicken","Mains",205,"Crispy chicken with a spicy house glaze.","New","https://images.unsplash.com/photo-1626645738196-c2a7c87a8f58?auto=format&fit=crop&w=700&q=80"],
["creamy-pasta","Creamy Pasta","Mains",175,"Creamy pasta with parmesan and herbs.","Must Try","https://images.unsplash.com/photo-1473093295043-cdd812d0e601?auto=format&fit=crop&w=700&q=80"],
["tomato-pasta","Tomato Pasta","Mains",165,"Tomato sauce, herbs and parmesan.","","https://images.unsplash.com/photo-1621996346565-e3dbc646d9a9?auto=format&fit=crop&w=700&q=80"],
["steak-rice","Steak & Rice","Mains",295,"Grilled beef with garlic rice and house sauce.","Best Seller","https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=700&q=80"],
["fish-rice","Crispy Fish & Rice","Mains",210,"Crispy fish fillet with garlic rice.","New","https://images.unsplash.com/photo-1515003197210-e380515399bf?auto=format&fit=crop&w=700&q=80"],
["classic-fries","Classic Fries","Sides",95,"Crispy golden fries, lightly salted.","Best Seller","https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=700&q=80"],
["cheese-fries","Cheese Fries","Sides",125,"Crispy fries topped with melted cheese.","Must Try","https://images.unsplash.com/photo-1585109649139-366815a0d713?auto=format&fit=crop&w=700&q=80"],
["garlic-rice","Garlic Rice","Sides",65,"Fragrant garlic fried rice.","","https://images.unsplash.com/photo-1516684732162-798a0062be99?auto=format&fit=crop&w=700&q=80"],
["onion-rings","Onion Rings","Sides",110,"Crispy battered onion rings.","","https://images.unsplash.com/photo-1639024471283-03518883512d?auto=format&fit=crop&w=700&q=80"],
["coleslaw","Creamy Coleslaw","Sides",75,"Fresh cabbage with creamy dressing.","New","https://images.unsplash.com/photo-1625938145744-e380515399bf?auto=format&fit=crop&w=700&q=80"],
["mashed-potato","Mashed Potato","Sides",85,"Creamy mashed potato with gravy.","","https://images.unsplash.com/photo-1600175074697-2f4d7d5b7d2c?auto=format&fit=crop&w=700&q=80"],
["cola","Cola","Drinks",70,"Cold and refreshing.","Best Seller","https://images.unsplash.com/photo-1629203851122-3726ecdf080e?auto=format&fit=crop&w=700&q=80"],
["lemonade","House Lemonade","Drinks",85,"Fresh, bright and lightly sweet.","New","https://images.unsplash.com/photo-1523677011781-c91d1bbe2f9e?auto=format&fit=crop&w=700&q=80"],
["iced-tea","Iced Tea","Drinks",75,"Classic refreshing iced tea.","Best Seller","https://images.unsplash.com/photo-1556679343-c7306c1976bc?auto=format&fit=crop&w=700&q=80"],
["orange-soda","Orange Soda","Drinks",70,"Bright citrus soda served cold.","","https://images.unsplash.com/photo-1544145945-f90425340c7e?auto=format&fit=crop&w=700&q=80"],
["iced-coffee","Iced Coffee","Drinks",110,"Cold coffee with milk and light sweetness.","New","https://images.unsplash.com/photo-1517701604599-bb29b565090c?auto=format&fit=crop&w=700&q=80"],
["water","Bottled Water","Drinks",45,"Chilled bottled water.","","https://images.unsplash.com/photo-1564419320461-6870880221ad?auto=format&fit=crop&w=700&q=80"],
["extra-cheese","Extra Cheese","Add Ons",35,"Add more melted cheese.","","https://images.unsplash.com/photo-1618164436241-4473940d1f5c?auto=format&fit=crop&w=700&q=80"],
["fried-egg","Fried Egg","Add Ons",30,"Sunny-side-up fried egg.","","https://images.unsplash.com/photo-1525351484163-7529414344d8?auto=format&fit=crop&w=700&q=80"],
["extra-patty","Extra Patty","Add Ons",90,"Add another beef patty.","Must Try","https://images.unsplash.com/photo-1586190848861-99aa4a171e90?auto=format&fit=crop&w=700&q=80"],
["extra-sauce","Extra House Sauce","Add Ons",20,"A side of our signature sauce.","","https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=700&q=80"],
["extra-gravy","Extra Gravy","Add Ons",25,"Extra serving of savory gravy.","","https://images.unsplash.com/photo-1601050690117-94f5f6fa8bd7?auto=format&fit=crop&w=700&q=80"],
["bacon","Extra Bacon","Add Ons",55,"Crispy bacon strips.","New","https://images.unsplash.com/photo-1528607929212-2636ec44253b?auto=format&fit=crop&w=700&q=80"]
].map(x=>({id:x[0],name:x[1],category:x[2],price:x[3],desc:x[4],tag:x[5],img:x[6]}));

let cart=[],orderType="Dine In",activeTab="Best Sellers";
const categories=["Best Sellers","New Items","Mains","Sides","Drinks","Add Ons"];
const money=n=>"₱"+n.toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2});


function openCart(){
  document.getElementById("cartPanel").classList.add("open");
  const bar=document.getElementById("viewOrdersBar");
  if(bar)bar.style.display="none";
}
function closeCart(){
  document.getElementById("cartPanel").classList.remove("open");
  const bar=document.getElementById("viewOrdersBar");
  if(bar)bar.style.display="";
}

function startOrder(type){
 orderType=type;
 document.getElementById("menuTitle").textContent=type;
 document.getElementById("orderTypeScreen").classList.add("hidden");
 document.querySelector(".app").classList.remove("hidden");
 closeCart();
 cart=[];renderCart();renderTabs();renderMenu();
}

function visibleProducts(){
 if(activeTab==="Best Sellers")return MENU.filter(x=>x.tag==="Best Seller"||x.tag==="Must Try");
 if(activeTab==="New Items")return MENU.filter(x=>x.tag==="New");
 return MENU.filter(x=>x.category===activeTab);
}
function renderTabs(){
 document.getElementById("tabs").innerHTML=categories.map(c=>`<button class="tab ${c===activeTab?"active":""}" onclick="setTab('${c}')">${c}</button>`).join("");
}
function setTab(t){activeTab=t;renderTabs();renderMenu()}
function renderMenu(){
 const p=visibleProducts();
 document.getElementById("menu").innerHTML=`<div class="section-title"><h2>${activeTab}</h2><span>${p.length} items</span></div><div class="products">${p.map(x=>`
 <article class="product" onclick="addItem('${x.id}')">
  <div class="photo"><img src="${x.img}" alt="${x.name}" loading="lazy">${x.tag?`<span class="badge">${x.tag}</span>`:""}</div>
  <div class="product-info"><h3>${x.name}</h3><div class="desc">${x.desc}</div><div class="price-row"><span class="price">${money(x.price)}</span><button class="add" tabindex="-1">Add</button></div></div>
 </article>`).join("")}</div>`;
}
function addItem(id){
 const p=MENU.find(x=>x.id===id),e=cart.find(x=>x.id===id);
 if(!p)return;
 if(e)e.qty++;else cart.push({id:p.id,name:p.name,price:p.price,qty:1});
 renderCart();

 const bar=document.getElementById("viewOrdersBar");
 bar.classList.remove("added");
 void bar.offsetWidth;
 bar.classList.add("added");
}
function changeQty(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);renderCart()}
function renderCart(){
 const count=cart.reduce((a,x)=>a+x.qty,0),sub=cart.reduce((a,x)=>a+x.price*x.qty,0);
 document.getElementById("snackCount").textContent=count;
 document.getElementById("snackItemsWord").textContent=count===1?"item":"items";
 document.getElementById("subtotal").textContent=money(sub);
 document.getElementById("total").textContent=money(sub);
 document.getElementById("checkout").disabled=!cart.length;
 document.getElementById("cartItems").innerHTML=cart.length?cart.map((x,i)=>`<div class="cart-item"><div class="cart-item-top"><div><h4>${x.name}</h4><small>${money(x.price)} each</small></div><strong>${money(x.price*x.qty)}</strong></div><div class="qty"><button onclick="changeQty(${i},-1)">−</button><span>${x.qty}</span><button onclick="changeQty(${i},1)">+</button></div></div>`).join(""):`<div class="empty">Your order is empty.<br><br>Tap a menu item to begin.</div>`;
}
function createReceipt(){
 const sub=cart.reduce((a,x)=>a+x.price*x.qty,0);
 let s="YOUR STORE\n------------------------------\n"+orderType.toUpperCase()+"\n"+new Date().toLocaleString("en-PH")+"\n------------------------------\n";
 cart.forEach(x=>s+=`${x.qty} x ${x.name}\n    ${money(x.price*x.qty)}\n`);
 return s+"------------------------------\nTOTAL: "+money(sub)+"\n------------------------------\nPlease bring this order slip to the cashier.\n";
}
function openCheckout(){
 document.getElementById("modalMeta").textContent=`${orderType} · ${cart.reduce((a,x)=>a+x.qty,0)} items · ${document.getElementById("total").textContent}`;
 document.getElementById("receiptPreview").textContent=createReceipt();
 document.getElementById("modal").classList.add("show");
}
function finishOrder(){
 cart=[];renderCart();
 closeCart();
 document.getElementById("modal").classList.remove("show");
 document.querySelector(".app").classList.add("hidden");
 document.getElementById("orderTypeScreen").classList.remove("hidden");
}
async function printOrder(){
 const receipt=createReceipt(),button=document.getElementById("print");
 button.disabled=true;button.textContent="Printing...";
 try{
  if(window.Android&&typeof window.Android.printReceipt==="function"){
   const r=window.Android.printReceipt(receipt);
   if(r&&String(r).toLowerCase()==="error")throw Error("Printer error");
  }else{
   throw Error("Direct Android printer connection is not available.");
  }
  setTimeout(finishOrder,700);
 }catch(e){
  const s=document.getElementById("printerStatus");
  s.className="printer-status show error";
  s.textContent=e.message||"Unable to print.";
 }finally{button.disabled=false;button.textContent="Print Order"}
}
document.getElementById("checkout").onclick=openCheckout;
document.getElementById("cancel").onclick=()=>document.getElementById("modal").classList.remove("show");
document.getElementById("print").onclick=printOrder;
renderTabs();renderMenu();renderCart();
</script>
</body>
</html>
