<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Customer Order Menu</title>
<style>
:root{--bg:#f5f5f3;--white:#fff;--text:#171717;--muted:#777;--line:#e6e6e3;--soft:#eeeeec;--black:#111;--green:#16834b;--red:#d83b3b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button{font:inherit;border:0;cursor:pointer}.app{min-height:100vh}.hidden{display:none!important}.hidden{display:none!important}
.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20}.brand{font-size:20px;font-weight:850;letter-spacing:-.04em}.order-type{display:flex;gap:4px;padding:4px;background:var(--soft);border-radius:12px}.order-type button{padding:10px 17px;border-radius:9px;background:transparent;color:#666;font-weight:750}.order-type button.active{background:#fff;color:#111;box-shadow:0 1px 5px #0001}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:calc(100vh - 72px)}.menu-area{padding:28px 30px 120px;min-width:0}.hero{margin-bottom:20px}.hero h1{margin:0;font-size:34px;letter-spacing:-.055em}.hero p{margin:7px 0 0;color:var(--muted)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{white-space:nowrap;padding:11px 18px;border-radius:999px;background:#fff;border:1px solid var(--line);color:#555;font-weight:750}.tab.active{background:#111;color:#fff;border-color:#111}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:22px 0 13px}.section-title h2{margin:0;font-size:18px}.section-title span{color:var(--muted);font-size:13px}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:14px}.product{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-height:300px;cursor:pointer;transition:transform .12s,box-shadow .12s}.product:active{transform:scale(.985);box-shadow:0 5px 18px #00000014}.photo{height:155px;background:#ddd;position:relative;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover;display:block}.badge{position:absolute;top:10px;left:10px;background:#fff;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:850}.product-info{padding:14px;display:flex;flex-direction:column;flex:1}.product-info h3{margin:0 0 5px;font-size:16px}.desc{color:var(--muted);font-size:12px;line-height:1.4;min-height:34px}.price-row{margin-top:auto;padding-top:12px;display:flex;align-items:center;justify-content:space-between}.price{font-weight:850}.add{background:#111;color:#fff;padding:9px 14px;border-radius:10px;font-weight:800;pointer-events:none}
.cart-panel{background:#fff;border-left:1px solid var(--line);position:sticky;top:72px;height:calc(100vh - 72px);display:flex;flex-direction:column}.cart-head{padding:22px;border-bottom:1px solid var(--line)}.cart-head h2{margin:0;font-size:22px}.cart-head p{margin:5px 0 0;color:var(--muted);font-size:13px}.cart-items{padding:14px 20px;overflow-y:auto;flex:1}.empty{text-align:center;color:#888;padding:60px 15px}.cart-item{padding:13px 0;border-bottom:1px solid var(--line)}.cart-item-top{display:flex;justify-content:space-between;gap:10px}.cart-item h4{margin:0;font-size:14px}.cart-item small{display:block;margin-top:3px;color:var(--muted)}.qty{display:flex;align-items:center;gap:9px;margin-top:9px}.qty button{width:28px;height:28px;border-radius:8px;background:var(--soft);font-weight:900}.qty span{min-width:16px;text-align:center;font-weight:800}.cart-bottom{padding:16px 20px 20px;border-top:1px solid var(--line)}.summary-row{display:flex;justify-content:space-between;margin:7px 0;color:#555}.summary-row.total{margin-top:14px;font-size:21px;font-weight:900;color:#111}.checkout{width:100%;margin-top:13px;padding:15px;border-radius:12px;background:#111;color:#fff;font-weight:850}.checkout:disabled{opacity:.35}
.modal-wrap{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal-wrap.show{display:flex}.modal{width:min(520px,100%);background:#fff;border-radius:20px;padding:24px;box-shadow:0 30px 80px #0005}.modal h2{margin:0 0 5px}.modal p{color:var(--muted);font-size:13px}.receipt{border:1px dashed #bbb;padding:15px;margin:18px 0;max-height:45vh;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;white-space:pre-wrap}.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.secondary{background:var(--soft);padding:13px;border-radius:11px;font-weight:800}.primary{background:#111;color:#fff;padding:13px;border-radius:11px;font-weight:800}.printer-status{margin:0 0 15px;padding:11px 13px;border-radius:10px;background:var(--soft);font-size:12px;display:none}.printer-status.show{display:block}.printer-status.error{background:#fff0f0;color:var(--red)}.printer-status.success{background:#eefaf3;color:var(--green)}

.order-type-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px;
  background:var(--bg);
}
.order-type-content{
  width:min(720px,100%);
  text-align:center;
}
.start-kicker{
  font-size:12px;
  font-weight:850;
  letter-spacing:.16em;
  color:var(--muted);
  margin-bottom:14px;
}
.order-type-content h1{
  margin:0;
  font-size:clamp(42px,7vw,72px);
  line-height:.96;
  letter-spacing:-.065em;
}
.order-type-content p{
  color:var(--muted);
  font-size:16px;
  margin:18px 0 34px;
}
.start-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}
.start-button{
  min-height:190px;
  border-radius:24px;
  background:#fff;
  border:1px solid var(--line);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:.12s;
}
.start-button:active{
  transform:scale(.98);
  background:#111;
  color:#fff;
}
.start-button span{
  font-size:28px;
  font-weight:850;
  letter-spacing:-.04em;
}
.start-button small{
  color:var(--muted);
  font-size:14px;
}
.start-button:active small{color:#bbb}
.app .menu-area{min-height:100vh}
.modal-wrap .modal{
  width:min(680px,100%);
  padding:32px;
}
.modal-wrap .modal h2{
  font-size:34px;
}
.modal-wrap .modal p{
  font-size:15px;
}
.modal-wrap .receipt{
  max-height:50vh;
  font-size:15px;
  line-height:1.65;
  padding:22px;
}
.modal-wrap .modal-actions{
  grid-template-columns:1fr 1.5fr;
}
.modal-wrap .primary,
.modal-wrap .secondary{
  padding:18px;
  font-size:16px;
}


.order-type-screen{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  height:100dvh;
  display:grid;
  grid-template-columns:1fr 1fr;
  background:#fff;
  z-index:9999;
}
.order-type-screen .start-button{
  width:100%;
  height:100%;
  border:0;
  border-radius:0;
  background:#fff;
  color:#111;
  font-size:clamp(36px,6vw,72px);
  font-weight:850;
  letter-spacing:-.055em;
  display:flex;
  align-items:center;
  justify-content:center;
}
.order-type-screen .start-button + .start-button{
  border-left:1px solid #e5e5e5;
}
.order-type-screen .start-button:hover,
.order-type-screen .start-button:active{
  background:#111;
  color:#fff;
}
@media(max-width:900px){.layout{display:block}.menu-area{padding:20px 16px 170px}.cart-panel{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;border-left:0;border-top:1px solid var(--line);z-index:30}.cart-items{display:none}.cart-head{padding:12px 18px;display:flex;align-items:center;justify-content:space-between;border:0}.cart-bottom{padding:0 18px 14px;border:0}.summary-row:not(.total){display:none}.summary-row.total{margin:0}.checkout{margin-top:8px}.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.product{min-height:260px}.photo{height:120px}.hero h1{font-size:28px}}
@media(max-width:500px){.order-type-screen .start-button{font-size:clamp(28px,8vw,48px)}</style>
</head>
<body>

<!-- ORDER TYPE START SCREEN -->
<section id="orderTypeScreen" class="order-type-screen">
  <button class="start-button" onclick="startOrder('Dine In')">Dine In</button>
  <button class="start-button" onclick="startOrder('Take Out')">Take Out</button>
</section>

<div class="app hidden">
<main class="layout">
<section class="menu-area">
<div class="hero"><h1>What would you like?</h1><p>Choose your food, customize your order, then print.</p></div>
<nav class="tabs" id="tabs"></nav>
<div id="menu"></div>
</section>
<aside class="cart-panel">
<div class="cart-head"><div><h2>Your Order</h2><p id="orderLabel">Dine In</p></div><div id="itemCount">0 items</div></div>
<div class="cart-items" id="cartItems"></div>
<div class="cart-bottom">
<div class="summary-row"><span>Subtotal</span><strong id="subtotal">₱0.00</strong></div>
<div class="summary-row"><span>Tax</span><strong>₱0.00</strong></div>
<div class="summary-row total"><span>Total</span><span id="total">₱0.00</span></div>
<button class="checkout" id="checkout" disabled>Review & Print Order</button>
</div>
</aside>
</main>
</div>

<div class="modal-wrap" id="modal">
<div class="modal">
<h2>Review Order</h2>
<p id="modalMeta"></p>
<div class="receipt" id="receiptPreview"></div>
<div class="printer-status" id="printerStatus"></div>
<div class="modal-actions"><button class="secondary" id="cancel">Back to Order</button><button class="primary" id="print">Print Order</button></div>
</div>
</div>

<script>
const MENU=[
{id:"burger",name:"Classic Burger",category:"Mains",price:180,desc:"Beef patty, lettuce, tomato and house sauce.",tag:"Best Seller",img:"https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=700&q=80"},
{id:"chicken",name:"Crispy Chicken",category:"Mains",price:195,desc:"Crispy fried chicken with gravy.",tag:"Must Try",img:"https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?auto=format&fit=crop&w=700&q=80"},
{id:"pasta",name:"Creamy Pasta",category:"Mains",price:175,desc:"Creamy pasta with parmesan and herbs.",tag:"",img:"https://images.unsplash.com/photo-1473093295043-cdd812d0e601?auto=format&fit=crop&w=700&q=80"},
{id:"fries",name:"Classic Fries",category:"Sides",price:95,desc:"Crispy golden fries, lightly salted.",tag:"",img:"https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=700&q=80"},
{id:"rice",name:"Garlic Rice",category:"Sides",price:65,desc:"Fragrant garlic fried rice.",tag:"",img:"https://images.unsplash.com/photo-1516684732162-798a0062be99?auto=format&fit=crop&w=700&q=80"},
{id:"cola",name:"Cola",category:"Drinks",price:70,desc:"Cold and refreshing.",tag:"",img:"https://images.unsplash.com/photo-1629203851122-3726ecdf080e?auto=format&fit=crop&w=700&q=80"},
{id:"lemonade",name:"House Lemonade",category:"Drinks",price:85,desc:"Fresh, bright and lightly sweet.",tag:"New",img:"https://images.unsplash.com/photo-1523677011781-c91d1bbe2f9e?auto=format&fit=crop&w=700&q=80"},
{id:"cheese",name:"Extra Cheese",category:"Add Ons",price:35,desc:"Add more melted cheese.",tag:"",img:"https://images.unsplash.com/photo-1618164436241-4473940d1f5c?auto=format&fit=crop&w=700&q=80"},
{id:"egg",name:"Fried Egg",category:"Add Ons",price:30,desc:"Sunny-side-up fried egg.",tag:"",img:"https://images.unsplash.com/photo-1525351484163-7529414344d8?auto=format&fit=crop&w=700&q=80"}
];

let cart=[],orderType="Dine In",activeTab="Featured";
let bluetoothDevice=null, bluetoothCharacteristic=null;

const money=n=>"₱"+n.toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2});
const categories=["Featured","Mains","Sides","Drinks","Add Ons"];

function renderTabs(){document.getElementById("tabs").innerHTML=categories.map(c=>`<button class="tab ${c===activeTab?"active":""}" onclick="setTab('${c}')">${c}</button>`).join("")}
function setTab(t){activeTab=t;renderTabs();renderMenu()}
function visibleProducts(){return activeTab==="Featured"?MENU.filter(x=>["Best Seller","Must Try","New"].includes(x.tag)):MENU.filter(x=>x.category===activeTab)}

function renderMenu(){
const products=visibleProducts();
document.getElementById("menu").innerHTML=`<div class="section-title"><h2>${activeTab==="Featured"?"Popular right now":activeTab}</h2><span>${products.length} items</span></div><div class="products">${products.map(p=>`
<article class="product" onclick="addItem('${p.id}')"><div class="photo"><img src="${p.img}" alt="${p.name}" loading="lazy">${p.tag?`<span class="badge">${p.tag}</span>`:""}</div>
<div class="product-info"><h3>${p.name}</h3><div class="desc">${p.desc}</div><div class="price-row"><span class="price">${money(p.price)}</span><button class="add" tabindex="-1">Add</button></div></div></article>`).join("")}</div>`;
}

function addItem(id){
const p=MENU.find(x=>x.id===id),existing=cart.find(x=>x.id===id);
if(existing)existing.qty++;else cart.push({id:p.id,name:p.name,price:p.price,qty:1});
renderCart();
}

function changeQty(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);renderCart()}

function renderCart(){
const count=cart.reduce((a,x)=>a+x.qty,0),subtotal=cart.reduce((a,x)=>a+x.price*x.qty,0);
document.getElementById("itemCount").textContent=`${count} ${count===1?"item":"items"}`;
document.getElementById("subtotal").textContent=money(subtotal);
document.getElementById("total").textContent=money(subtotal);
document.getElementById("checkout").disabled=!cart.length;
document.getElementById("cartItems").innerHTML=cart.length?cart.map((x,i)=>`
<div class="cart-item"><div class="cart-item-top"><div><h4>${x.name}</h4><small>${money(x.price)} each</small></div><strong>${money(x.price*x.qty)}</strong></div>
<div class="qty"><button onclick="changeQty(${i},-1)">−</button><span>${x.qty}</span><button onclick="changeQty(${i},1)">+</button></div></div>`).join(""):`<div class="empty">Your order is empty.<br><br>Tap <b>Add</b> on a menu item to begin.</div>`;
}


function startOrder(type){
  orderType = type;

  document.getElementById("orderTypeScreen").classList.add("hidden");
  document.querySelector(".app").classList.remove("hidden");

  cart = [];
  renderCart();
}

function finishOrder(){
  cart = [];
  renderCart();

  document.getElementById("modal").classList.remove("show");
  document.querySelector(".app").classList.add("hidden");
  document.getElementById("orderTypeScreen").classList.remove("hidden");
}

function createReceipt(){
const subtotal=cart.reduce((a,x)=>a+x.price*x.qty,0);
let s="YOUR STORE\n------------------------------\n"+orderType.toUpperCase()+"\n"+new Date().toLocaleString("en-PH")+"\n------------------------------\n";
cart.forEach(x=>{s+=`${x.qty} x ${x.name}\n    ${money(x.price*x.qty)}\n`});
s+="------------------------------\nTOTAL: "+money(subtotal)+"\n------------------------------\nPlease bring this order slip to the cashier.\n";
return s;
}

function openCheckout(){
if(!cart.length)return;
document.getElementById("modalMeta").textContent=`${orderType} · ${cart.reduce((a,x)=>a+x.qty,0)} items · ${document.getElementById("total").textContent}`;
document.getElementById("receiptPreview").textContent=createReceipt();
clearStatus();
document.getElementById("modal").classList.add("show");
}

function clearStatus(){const e=document.getElementById("printerStatus");e.className="printer-status";e.textContent=""}
function status(message,type){const e=document.getElementById("printerStatus");e.className="printer-status show "+type;e.textContent=message}

/*
ANDROID NATIVE BRIDGE
Preferred production path.

Your Android WebView should expose:
window.Android.printReceipt(receipt)

It should send the receipt directly to the paired Bluetooth ESC/POS printer.
*/
async function nativePrint(receipt){
if(window.Android && typeof window.Android.printReceipt==="function"){
const result=window.Android.printReceipt(receipt);
if(result && String(result).toLowerCase()==="error")throw new Error("Android printer error");
return true;
}
return false;
}

/*
WEB BLUETOOTH FALLBACK

This works only with printers that expose a Bluetooth LE GATT
write characteristic. Most inexpensive classic-Bluetooth ESC/POS
printers use Bluetooth SPP instead, which Chrome cannot access.

If the printer is already connected at Android system level but
uses SPP, the native Android bridge above is required.
*/
async function connectWebBluetoothPrinter(){
if(!navigator.bluetooth)throw new Error("Web Bluetooth is not supported on this browser.");

bluetoothDevice=await navigator.bluetooth.requestDevice({
acceptAllDevices:true,
optionalServices:[0xFFE0,0xFFE1,0x18F0]
});

bluetoothDevice.addEventListener("gattserverdisconnected",()=>{
bluetoothCharacteristic=null;
bluetoothDevice=null;
});

const server=await bluetoothDevice.gatt.connect();
const services=await server.getPrimaryServices();

for(const service of services){
const chars=await service.getCharacteristics();
for(const characteristic of chars){
if(characteristic.properties.write||characteristic.properties.writeWithoutResponse){
bluetoothCharacteristic=characteristic;
return true;
}
}
}

throw new Error("No writable Bluetooth printer characteristic was found.");
}

function textToBytes(text){
return new TextEncoder().encode(text);
}

async function webBluetoothPrint(receipt){
if(!bluetoothCharacteristic){
await connectWebBluetoothPrinter();
}
const bytes=textToBytes("\x1B\x40"+receipt+"\n\n\n\x1D\x56\x00");
const chunkSize=180;

for(let i=0;i<bytes.length;i+=chunkSize){
const chunk=bytes.slice(i,i+chunkSize);
if(bluetoothCharacteristic.properties.writeWithoutResponse){
await bluetoothCharacteristic.writeValueWithoutResponse(chunk);
}else{
await bluetoothCharacteristic.writeValue(chunk);
}
}
}

async function printOrder(){
const receipt=createReceipt();
const button=document.getElementById("print");
clearStatus();
button.disabled=true;
button.textContent="Printing...";

try{
/* 1. Preferred: Android native direct print */
const native=await nativePrint(receipt);

if(native){
status("Order sent to printer.","success");
}else{
/* 2. Browser fallback for BLE-capable printers */
await webBluetoothPrint(receipt);
status("Order sent to printer.","success");
}

setTimeout(()=>{
  finishOrder();
},700);

}catch(error){
console.error(error);

let message="Unable to print.";

if(!window.Android && !navigator.bluetooth){
message="This browser cannot access the printer. Use the Android printer app.";
}else if(error&&error.message){
message=error.message;
}

status(message,"error");

}finally{
button.disabled=false;
button.textContent="Print Order";
}
}

document.getElementById("checkout").onclick=openCheckout;
document.getElementById("cancel").onclick=()=>document.getElementById("modal").classList.remove("show");
document.getElementById("print").onclick=printOrder;

renderTabs();
renderMenu();
renderCart();
</script>
</body>
</html>
